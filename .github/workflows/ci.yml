name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check (API + web)
        run: pnpm check

      - name: Tests (API + web)
        run: pnpm test

      - name: Build (API + web)
        run: pnpm build

      - name: Dependency audit (production)
        run: pnpm audit --prod
