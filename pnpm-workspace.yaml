packages:
  - 'packages/*'
allowBuilds:
  better-sqlite3: true
  esbuild: true
  tesseract.js: true
# Force patched versions of transitive dependencies that Express 4 and cheerio still pin to vulnerable releases.
overrides:
  proxy-addr: '>=2.0.8 <3'
  qs: '>=6.16.0 <7'
  body-parser: '>=1.20.6 <2'
  undici: '>=7.29.1 <8'
